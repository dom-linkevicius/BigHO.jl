name: Benchmarks
# Manual dispatch only -- deploy-scale (BIGHO_BENCHMARK_DEPLOY=true) trials train real CNNs
# for up to R_MAX*EPOCHS_PER_RESOURCE epochs each, easily many hours per sampler/executor/
# repeat combination, so this isn't something to fire off automatically on a schedule.
on:
  workflow_dispatch:
permissions:
  contents: write   # explicit -- dispatch runs need to push the regenerated plot
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 1440   # generous -- see the note above on why a single run can be long
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - run: julia --project=benchmarks -e 'using Pkg; Pkg.instantiate()'
      - run: JULIA_NUM_THREADS=auto BIGHO_BENCHMARK_DEPLOY=true julia --project=benchmarks benchmarks/run_benchmarks.jl
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh benchmark plot"
          file_pattern: docs/benchmarks/*.png
