name: CI
on: [push, pull_request]
jobs:
  # Each concern is a separate call to the reusable test.yml workflow (rather
  # than one flat os/julia/concern matrix here) so the GitHub checks UI groups
  # each concern's os/julia legs under its own collapsible entry, instead of
  # listing all 30 combinations flat.
  test:
    strategy:
      fail-fast: false
      matrix:
        concern: [basic, samplers, serial, threaded, distributed]
    uses: ./.github/workflows/test.yml
    with:
      concern: ${{ matrix.concern }}
    secrets: inherit

  # A single stable check name for branch protection to require, regardless
  # of how the test matrix above grows or shrinks -- otherwise every matrix
  # change (a new Julia version, OS, or concern) would also require updating
  # the required-checks list on master, and forgetting to remove a dropped
  # leg there leaves it permanently "pending", blocking every future merge.
  ci-success:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.test.result, 'failure') || contains(needs.test.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more matrix jobs failed"
            exit 1
          fi
